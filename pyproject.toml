[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kryon"
version = "0.1.0"
description = "A hypothesis-driven, autonomous, multi-agent framework for safe and verifiable security research."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Anonymous" },
]
keywords = ["security", "ai-agent", "penetration-testing", "bug-bounty", "purple-team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    # LLM gateway — supports 100+ providers including Ollama
    "litellm>=1.50.0",
    # Graph database
    "kuzu>=0.7.0",
    # Data validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # TUI
    "textual>=0.80.0",
    # Logging
    "structlog>=24.4.0",
    # MCP
    "mcp>=1.0.0",
    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    # Async helpers
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    # Container
    "aiodocker>=0.22.0",
    # Crypto (for secret encryption)
    "cryptography>=43.0.0",
    # JSON (fast)
    "orjson>=3.10.0",
    # YAML
    "pyyaml>=6.0",
    # Prompts
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-PyYAML",
    "types-aiofiles",
]

[project.scripts]
kryon = "kryon.cli.main:app"

[project.urls]
Homepage = "https://kryon.dev"
Repository = "https://github.com/anonymous/kryon"
Issues = "https://github.com/anonymous/kryon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kryon"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "TID", "ARG", "PTH", "ERA", "PL", "RUF"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "RET505", "RET506", "PLW0603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"src/kryon/subagents/prompts.py" = ["E501"]
"src/kryon/subagents/base.py" = ["ARG002"]
"src/kryon/subagents/impl.py" = ["ARG002"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_ignores = true
warn_return_any = true
disallow_any_explicit = false
disallow_any_generics = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["kuzu.*", "aiodocker.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.pytest-asyncio]
mode = "auto"
